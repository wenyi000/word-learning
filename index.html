<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>背单词抽页码</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f7;
      color: #333;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 22px;
      text-align: center;
      margin: 16px 0 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #1c1c1e;
    }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .status-item {
      background: #f2f2f7;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .status-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    .status-value {
      font-size: 20px;
      font-weight: 700;
      color: #007aff;
    }
    label {
      display: block;
      font-size: 14px;
      color: #666;
      margin: 10px 0 6px;
    }
    input[type="number"], select, input[type="text"].word-input, input[type="text"].dict-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    .btn-primary { background: #007aff; color: #fff; }
    .btn-success { background: #34c759; color: #fff; }
    .btn-warning { background: #ff9500; color: #fff; }
    .btn-danger { background: #ff3b30; color: #fff; }
    .btn-secondary { background: #8e8e93; color: #fff; }
    .btn-add-word, .btn-speak {
      width: auto;
      padding: 8px 14px;
      margin: 0;
      border-radius: 8px;
      font-size: 13px;
    }
    .btn-add-word { background: #007aff; color: #fff; }
    .btn-speak { background: #34c759; color: #fff; }
    .result-box {
      background: #e8f4fd;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.6;
    }
    .result-title {
      font-weight: 600;
      color: #007aff;
      margin-bottom: 6px;
    }
    .page-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .page-card {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #d1e6f7;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 4px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .page-header:active {
      background: #f0f7ff;
    }
    .click-hint {
      font-size: 12px;
      color: #007aff;
      background: #e8f4fd;
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .page-title {
      font-weight: 600;
      color: #007aff;
    }
    .page-meta {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }
    .word-count {
      font-size: 13px;
      color: #666;
    }
    .word-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #cce0f0;
    }
    .word-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    .word-tag {
      background: #f2f2f7;
      border-radius: 12px;
      padding: 10px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .word-info {
      flex: 1;
    }
    .word-text {
      font-weight: 600;
      color: #333;
    }
    .word-phonetic {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }
    .word-meaning {
      font-size: 13px;
      color: #555;
      margin-top: 2px;
    }
    .word-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .delete-word {
      color: #ff3b30;
      cursor: pointer;
      font-weight: bold;
      font-size: 18px;
      padding: 0 4px;
    }
    .dict-input-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }
    .dict-input-row .dict-input {
      margin: 0;
    }
    .word-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .word-input-row .word-input {
      flex: 1;
      margin: 0;
    }
    .empty-tip {
      font-size: 13px;
      color: #999;
      font-style: italic;
    }
    .history-item {
      font-size: 13px;
      color: #666;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }
    .hidden { display: none; }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin: 24px 0;
    }
    .tip {
      font-size: 13px;
      color: #666;
      margin-top: 8px;
    }
    .schedule-date {
      font-weight: 600;
      color: #333;
      margin-top: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    .schedule-action {
      font-size: 13px;
      color: #555;
      margin: 6px 0 4px;
    }
    .schedule-pages {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
    }
    .schedule-page {
      background: #e8f4fd;
      color: #007aff;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }
    .loading {
      font-size: 12px;
      color: #007aff;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: #f2f2f7;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #007aff;
    }
    .stat-label {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }
    .date-query {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0;
    }
    .date-query input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
    }
    .query-result {
      background: #e8f4fd;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-top: 10px;
    }
    .query-result-number {
      font-size: 32px;
      font-weight: 700;
      color: #007aff;
    }
    .calendar-wrap {
      margin-top: 16px;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .calendar-month-title {
      font-weight: 600;
      font-size: 16px;
    }
    .calendar-nav {
      background: #f2f2f7;
      border: none;
      width: auto;
      height: 32px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin: 0;
      padding: 0 10px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .calendar-weekday {
      text-align: center;
      font-size: 12px;
      color: #999;
      padding: 4px 0;
    }
    .calendar-day {
      aspect-ratio: 1;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      background: #f2f2f7;
      color: #333;
      cursor: pointer;
      transition: transform 0.1s;
      position: relative;
    }
    .calendar-day:active {
      transform: scale(0.95);
    }
    .calendar-day.has-words {
      background: #d1e9ff;
      color: #007aff;
      font-weight: 600;
    }
    .calendar-day.selected {
      outline: 2px solid #007aff;
      outline-offset: -2px;
    }
    .calendar-day .day-count {
      font-size: 10px;
      color: #007aff;
      margin-top: 1px;
    }
    .calendar-day.empty {
      background: transparent;
      cursor: default;
    }
    .calendar-legend {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 8px;
      font-size: 12px;
      color: #666;
    }
    .legend-box {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: #d1e9ff;
    }
    .selected-day-detail {
      background: #f2f2f7;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }
    .selected-day-detail h4 {
      font-size: 14px;
      color: #333;
      margin-bottom: 8px;
    }
    .selected-pages {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .selected-page-tag {
      background: #fff;
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>背单词抽页码</h1>

  <div class="card">
    <div class="card-title">设置</div>
    <label>单词本总页数</label>
    <input type="number" id="totalPages" value="634" min="1">
    <button class="btn-secondary" onclick="initFromInput()">初始化 / 重置</button>
  </div>

  <div class="card">
    <div class="card-title">今天指定背诵页面</div>
    <label>今天背了哪几页？（用逗号分隔）</label>
    <input type="text" id="todayPages" placeholder="例如：56,231,256">
    <button class="btn-primary" onclick="recordTodayPages()">记录今天背诵</button>
    <div id="todayResult" class="result-box hidden">
      <div class="result-title">今天背诵的页面</div>
      <div class="tip">点击每一页展开，即可添加单词</div>
      <div class="page-list" id="todayResultList"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">当前状态</div>
    <div class="status-grid" id="statusGrid">
      <div class="status-item">
        <div class="status-label">单词池</div>
        <div class="status-value" id="newCount">0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">从单词池抽取</div>
    <label>今天要抽几页？</label>
    <input type="number" id="newDrawCount" value="5" min="1">
    <button class="btn-primary" onclick="drawNew()">抽取新页</button>
    <div id="newResult" class="result-box hidden">
      <div class="result-title">今天新背</div>
      <div class="tip">点击每一页展开，即可添加单词</div>
      <div class="page-list" id="newResultList"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">抽取复习单词池</div>
    <label>选择复习单词池</label>
    <select id="reviewPoolSelect"></select>
    <label>今天要复习几页？</label>
    <input type="number" id="reviewDrawCount" value="3" min="1">
    <button class="btn-success" onclick="drawReview()">抽取复习</button>
    <div id="reviewResult" class="result-box hidden">
      <div class="result-title" id="reviewResultTitle">复习内容</div>
      <div class="tip">点击每一页展开，即可查看/编辑单词</div>
      <div class="page-list" id="reviewResultList"></div>
      <button class="btn-warning" id="moveNextBtn" onclick="moveToNextPool()" style="margin-top:12px;">复习完成，移入下一轮</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">背诵日程</div>
    <div id="scheduleList"></div>
  </div>

  <div class="card">
    <div class="card-title">我的单词本</div>
    <div class="tip">这里列出你所有背过的页面，点击即可添加/查看单词</div>
    <div class="page-list" id="wordBookList"></div>
  </div>

  <div class="card">
    <div class="card-title">单词统计</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">累计单词</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statThisWeek">0</div>
        <div class="stat-label">本周单词</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statThisMonth">0</div>
        <div class="stat-label">本月单词</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statToday">0</div>
        <div class="stat-label">今日单词</div>
      </div>
    </div>
    <label>自定义时间范围查询</label>
    <div class="date-query">
      <input type="date" id="queryStartDate">
      <input type="date" id="queryEndDate">
    </div>
    <button class="btn-secondary" onclick="queryDateRange()">查询该时间段单词数</button>
    <div id="queryResult" class="query-result hidden">
      <div class="query-result-number" id="queryResultNumber">0</div>
      <div class="stat-label" id="queryResultLabel">个单词</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">背单词日历</div>
    <div class="calendar-wrap">
      <div class="calendar-header">
        <button class="calendar-nav" onclick="changeCalendarMonth(-1)">上月</button>
        <div class="calendar-month-title" id="calendarMonthTitle">2026年10月</div>
        <button class="calendar-nav" onclick="changeCalendarMonth(1)">下月</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="calendar-legend">
        <div class="legend-box"></div>
        <span>当天有背单词</span>
      </div>
      <div id="selectedDayDetail" class="selected-day-detail hidden">
        <h4 id="selectedDayTitle"></h4>
        <div class="selected-pages" id="selectedDayPages"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">数据备份</div>
    <button class="btn-primary" onclick="exportData()">导出备份</button>
    <label style="margin-top:10px;">导入备份文件</label>
    <input type="file" id="importFile" accept=".json" onchange="importData(this)">
  </div>

  <div class="footer">数据自动保存在本机浏览器中</div>

  <script>
    const STORAGE_KEY = 'wordLearningState_v4';
    let state = null;
    let lastReviewDraw = null;
    let lastDrawnNew = null;
    let lastTodayPages = null;

    const DATA_VERSION = 4;

    function initState(total = 634) {
      return {
        version: DATA_VERSION,
        total: total,
        newPool: Array.from({length: total}, (_, i) => i + 1),
        reviewPools: {},
        wordMap: {},
        firstDrawnMap: {},
        history: []
      };
    }

    function migrateState(data) {
      if (!data) return initState();
      // 确保所有字段存在
      if (!data.version) data.version = 1;
      if (!data.newPool) data.newPool = Array.from({length: data.total || 634}, (_, i) => i + 1);
      if (!data.reviewPools) data.reviewPools = {};
      if (!data.wordMap) data.wordMap = {};
      if (!data.firstDrawnMap) data.firstDrawnMap = {};
      if (!data.history) data.history = [];
      // 兼容旧版 wordMap（字符串数组转成对象数组，补上 addedAt）
      for (const page in data.wordMap) {
        const defaultDate = data.firstDrawnMap[page] || getTodayStr();
        data.wordMap[page] = data.wordMap[page].map(item => {
          if (typeof item === 'string') {
            return { word: item, phonetic: '', meaning: '', addedAt: defaultDate };
          }
          if (!item.addedAt) {
            item.addedAt = defaultDate;
          }
          return item;
        });
      }
      data.version = DATA_VERSION;
      return data;
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const data = JSON.parse(saved);
          return migrateState(data);
        } catch (e) {
          console.error('读取保存数据失败', e);
        }
      }
      return initState();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getNowStr() {
      return new Date().toLocaleString('zh-CN');
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function drawFromPool(pool, count) {
      if (count <= 0 || pool.length === 0) return [];
      const shuffled = shuffleArray(pool);
      return shuffled.slice(0, Math.min(count, pool.length)).sort((a, b) => a - b);
    }

    function removePages(pool, pages) {
      return pool.filter(p => !pages.includes(p));
    }

    function addToPool(poolName, pages) {
      if (!state.reviewPools[poolName]) {
        state.reviewPools[poolName] = [];
      }
      state.reviewPools[poolName] = [...new Set([...state.reviewPools[poolName], ...pages])].sort((a, b) => a - b);
    }

    function logAction(action, pages) {
      const time = getNowStr();
      state.history.unshift({ time, action, pages });
      if (state.history.length > 200) state.history.pop();
    }

    function recordFirstDrawn(pages) {
      const today = getTodayStr();
      pages.forEach(page => {
        if (!state.firstDrawnMap[page]) {
          state.firstDrawnMap[page] = today;
        }
      });
    }

    function getFirstDrawn(page) {
      return state.firstDrawnMap[page] || null;
    }

    // ============== 字典功能 ==============

    function normalizeWordItem(item, defaultDate) {
      if (typeof item === 'string') {
        return { word: item, phonetic: '', meaning: '', addedAt: defaultDate || getTodayStr() };
      }
      return {
        word: item.word || '',
        phonetic: item.phonetic || '',
        meaning: item.meaning || '',
        addedAt: item.addedAt || defaultDate || getTodayStr()
      };
    }

    function getWords(page) {
      const list = state.wordMap[page] || [];
      const defaultDate = getFirstDrawn(page) || getTodayStr();
      return list.map(item => normalizeWordItem(item, defaultDate));
    }

    function addWordItem(page, item) {
      const defaultDate = getFirstDrawn(page) || getTodayStr();
      const normalized = normalizeWordItem(item, defaultDate);
      if (!normalized.word) return;
      if (!state.wordMap[page]) {
        state.wordMap[page] = [];
      }
      // 如果单词已存在，更新音标和释义
      const existingIndex = state.wordMap[page].findIndex(i => {
        const ni = normalizeWordItem(i, defaultDate);
        return ni.word.toLowerCase() === normalized.word.toLowerCase();
      });
      if (existingIndex >= 0) {
        const existing = normalizeWordItem(state.wordMap[page][existingIndex], defaultDate);
        state.wordMap[page][existingIndex] = {
          word: normalized.word,
          phonetic: normalized.phonetic || existing.phonetic,
          meaning: normalized.meaning || existing.meaning,
          addedAt: normalized.addedAt
        };
      } else {
        state.wordMap[page].push(normalized);
      }
      saveState();
      renderPageList('newResultList', lastDrawnNew || []);
      if (lastReviewDraw) {
        renderPageList('reviewResultList', lastReviewDraw.drawn);
      }
      renderStats();
    }

    function removeWord(page, word) {
      if (state.wordMap[page]) {
        const defaultDate = getFirstDrawn(page) || getTodayStr();
        state.wordMap[page] = state.wordMap[page].filter(i => {
          const ni = normalizeWordItem(i, defaultDate);
          return ni.word !== word;
        });
        if (state.wordMap[page].length === 0) {
          delete state.wordMap[page];
        }
        saveState();
        renderPageList('newResultList', lastDrawnNew || []);
        if (lastReviewDraw) {
          renderPageList('reviewResultList', lastReviewDraw.drawn);
        }
        renderStats();
      }
    }

    async function fetchDictionary(word) {
      try {
        const resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
        if (!resp.ok) return null;
        const data = await resp.json();
        if (!data || !data[0]) return null;
        const entry = data[0];
        const phonetic = entry.phonetic || (entry.phonetics && entry.phonetics.find(p => p.text)?.text) || '';
        let meaning = '';
        if (entry.meanings && entry.meanings[0] && entry.meanings[0].definitions) {
          const defs = entry.meanings[0].definitions.slice(0, 2).map(d => d.definition).join('; ');
          meaning = defs;
        }
        return { phonetic, meaning };
      } catch (e) {
        console.error('查词失败', e);
        return null;
      }
    }

    async function addWordsFromInput(page) {
      const wordInput = document.getElementById(`word-input-${page}`);
      const phoneticInput = document.getElementById(`phonetic-input-${page}`);
      const meaningInput = document.getElementById(`meaning-input-${page}`);
      if (!wordInput) return;

      const word = wordInput.value.trim();
      if (!word) return;

      const loadingEl = document.getElementById(`loading-${page}`);
      if (loadingEl) loadingEl.classList.remove('hidden');

      let phonetic = phoneticInput ? phoneticInput.value.trim() : '';
      let meaning = meaningInput ? meaningInput.value.trim() : '';

      // 如果没有填音标和释义，尝试自动获取
      if (!phonetic || !meaning) {
        const dict = await fetchDictionary(word);
        if (dict) {
          if (!phonetic) phonetic = dict.phonetic;
          if (!meaning) meaning = dict.meaning;
        }
      }

      addWordItem(page, { word, phonetic, meaning });

      wordInput.value = '';
      if (phoneticInput) phoneticInput.value = '';
      if (meaningInput) meaningInput.value = '';
      if (loadingEl) loadingEl.classList.add('hidden');
    }

    function speakWord(word) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(word);
        utter.lang = 'en-US';
        utter.rate = 0.9;
        window.speechSynthesis.speak(utter);
      } else {
        alert('当前浏览器不支持语音朗读');
      }
    }

    function togglePageWords(page) {
      const section = document.getElementById(`word-section-${page}`);
      if (section) {
        section.classList.toggle('hidden');
      }
    }

    function renderWords(page) {
      const words = getWords(page);
      if (words.length === 0) {
        return '<div class="empty-tip">暂无单词，点击下方添加</div>';
      }
      return words.map(w => `
        <div class="word-tag">
          <div class="word-info">
            <div class="word-text">${w.word}</div>
            ${w.phonetic ? `<div class="word-phonetic">${w.phonetic}</div>` : ''}
            ${w.meaning ? `<div class="word-meaning">${w.meaning}</div>` : ''}
          </div>
          <div class="word-actions">
            <button class="btn-speak" onclick="event.stopPropagation(); speakWord('${w.word.replace(/'/g, "\\'")}')">朗读</button>
            <span class="delete-word" onclick="event.stopPropagation(); removeWord(${page}, '${w.word.replace(/'/g, "\\'")}')">×</span>
          </div>
        </div>
      `).join('');
    }

    function renderPageList(containerId, pages, expandFirst = true) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = pages.map((p, index) => {
        const firstDate = getFirstDrawn(p);
        const dateText = firstDate ? `首次抽到：${firstDate}` : '首次抽到：今天';
        const isExpanded = expandFirst && index === 0 ? '' : 'hidden';
        return `
        <div class="page-card">
          <div class="page-header" onclick="togglePageWords(${p})">
            <div>
              <span class="page-title">第 ${p} 页</span>
              <div class="page-meta">${dateText}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="word-count">${getWords(p).length} 个单词</span>
              <span class="click-hint">点击展开</span>
            </div>
          </div>
          <div class="word-section ${isExpanded}" id="word-section-${p}">
            <div class="word-list" id="word-list-${p}">
              ${renderWords(p)}
            </div>
            <div class="dict-input-row" onclick="event.stopPropagation()">
              <input type="text" class="dict-input" id="word-input-${p}" placeholder="单词，例如：abandon">
              <input type="text" class="dict-input" id="phonetic-input-${p}" placeholder="音标（可自动获取）">
              <input type="text" class="dict-input" id="meaning-input-${p}" placeholder="中文释义（可自动获取）">
            </div>
            <div class="word-input-row" onclick="event.stopPropagation()">
              <span class="loading hidden" id="loading-${p}">正在查词...</span>
              <button class="btn-add-word" onclick="addWordsFromInput(${p})">添加单词</button>
            </div>
          </div>
        </div>
      `}).join('');
    }

    // ============== 页面渲染 ==============

    function renderStatus() {
      document.getElementById('totalPages').value = state.total;
      document.getElementById('newCount').textContent = state.newPool.length;

      const grid = document.getElementById('statusGrid');
      grid.innerHTML = `
        <div class="status-item">
          <div class="status-label">单词池</div>
          <div class="status-value">${state.newPool.length}</div>
        </div>
      `;

      const poolNames = Object.keys(state.reviewPools).sort((a, b) => parseInt(a) - parseInt(b));
      poolNames.forEach(name => {
        if (state.reviewPools[name].length > 0) {
          grid.innerHTML += `
            <div class="status-item">
              <div class="status-label">复习单词池 ${name}</div>
              <div class="status-value">${state.reviewPools[name].length}</div>
            </div>
          `;
        }
      });

      const select = document.getElementById('reviewPoolSelect');
      select.innerHTML = '';
      const nonEmptyPools = poolNames.filter(name => state.reviewPools[name].length > 0);
      if (nonEmptyPools.length === 0) {
        select.innerHTML = '<option value="">没有可复习的页码</option>';
      } else {
        nonEmptyPools.forEach(name => {
          select.innerHTML += `<option value="${name}">复习单词池 ${name}（${state.reviewPools[name].length} 页）</option>`;
        });
      }
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (state.history.length === 0) {
        list.innerHTML = '<div class="history-item">暂无操作记录</div>';
        return;
      }
      list.innerHTML = state.history.slice(0, 20).map(h => `
        <div class="history-item">
          <strong>${h.time}</strong><br>
          ${h.action}：${h.pages.join('、')}
        </div>
      `).join('');
    }

    function renderSchedule() {
      const container = document.getElementById('scheduleList');
      if (state.history.length === 0) {
        container.innerHTML = '<div class="empty-tip">暂无日程记录</div>';
        return;
      }

      const groups = {};
      state.history.forEach(h => {
        const date = h.time.split(' ')[0];
        if (!groups[date]) {
          groups[date] = [];
        }
        groups[date].push(h);
      });

      const dates = Object.keys(groups).sort((a, b) => new Date(b) - new Date(a));

      container.innerHTML = dates.map(date => {
        const items = groups[date];
        return `
          <div class="schedule-date">${date}</div>
          ${items.map(h => `
            <div class="schedule-action">${h.action}</div>
            <div class="schedule-pages">
              ${h.pages.map(p => `<span class="schedule-page">第 ${p} 页</span>`).join('')}
            </div>
          `).join('')}
        `;
      }).join('');
    }

    // ============== 统计功能 ==============

    function getAllWordItems() {
      const items = [];
      for (const page in state.wordMap) {
        const defaultDate = getFirstDrawn(page) || getTodayStr();
        state.wordMap[page].forEach(item => {
          const normalized = normalizeWordItem(item, defaultDate);
          items.push({ ...normalized, page: parseInt(page) });
        });
      }
      return items;
    }

    function getWordCountByDate() {
      const counts = {};
      const pagesByDate = {};
      getAllWordItems().forEach(item => {
        const date = item.addedAt;
        counts[date] = (counts[date] || 0) + 1;
        if (!pagesByDate[date]) pagesByDate[date] = new Set();
        pagesByDate[date].add(item.page);
      });
      const result = {};
      for (const date in counts) {
        result[date] = {
          count: counts[date],
          pages: Array.from(pagesByDate[date]).sort((a, b) => a - b)
        };
      }
      return result;
    }

    function countWordsInRange(startDate, endDate) {
      const byDate = getWordCountByDate();
      let count = 0;
      for (const date in byDate) {
        if (date >= startDate && date <= endDate) {
          count += byDate[date].count;
        }
      }
      return count;
    }

    function getThisWeekRange() {
      const now = new Date();
      const day = now.getDay();
      const diff = now.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(now.getFullYear(), now.getMonth(), diff);
      const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
      return [formatDate(monday), formatDate(sunday)];
    }

    function getThisMonthRange() {
      const now = new Date();
      const first = new Date(now.getFullYear(), now.getMonth(), 1);
      const last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      return [formatDate(first), formatDate(last)];
    }

    function formatDate(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function renderStats() {
      const byDate = getWordCountByDate();
      const today = getTodayStr();
      const [weekStart, weekEnd] = getThisWeekRange();
      const [monthStart, monthEnd] = getThisMonthRange();

      let total = 0;
      let todayCount = 0;
      let weekCount = 0;
      let monthCount = 0;

      for (const date in byDate) {
        const c = byDate[date].count;
        total += c;
        if (date === today) todayCount += c;
        if (date >= weekStart && date <= weekEnd) weekCount += c;
        if (date >= monthStart && date <= monthEnd) monthCount += c;
      }

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statThisWeek').textContent = weekCount;
      document.getElementById('statThisMonth').textContent = monthCount;
      document.getElementById('statToday').textContent = todayCount;
    }

    function queryDateRange() {
      const start = document.getElementById('queryStartDate').value;
      const end = document.getElementById('queryEndDate').value;
      if (!start || !end) {
        alert('请选择开始和结束日期');
        return;
      }
      if (start > end) {
        alert('开始日期不能晚于结束日期');
        return;
      }
      const count = countWordsInRange(start, end);
      document.getElementById('queryResult').classList.remove('hidden');
      document.getElementById('queryResultNumber').textContent = count;
      document.getElementById('queryResultLabel').textContent = `${start} 至 ${end} 共背了`;
    }

    // ============== 日历功能 ==============

    let calendarCurrentDate = new Date();
    let selectedCalendarDate = null;

    function renderCalendar() {
      const year = calendarCurrentDate.getFullYear();
      const month = calendarCurrentDate.getMonth();
      document.getElementById('calendarMonthTitle').textContent = `${year}年${month + 1}月`;

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startWeekDay = firstDay.getDay();
      const daysInMonth = lastDay.getDate();

      const byDate = getWordCountByDate();
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      weekdays.forEach(wd => {
        grid.innerHTML += `<div class="calendar-weekday">${wd}</div>`;
      });

      // 空白
      for (let i = 0; i < startWeekDay; i++) {
        grid.innerHTML += `<div class="calendar-day empty"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayData = byDate[dateStr];
        const hasWords = dayData && dayData.count > 0;
        const isSelected = selectedCalendarDate === dateStr;
        const cls = `calendar-day ${hasWords ? 'has-words' : ''} ${isSelected ? 'selected' : ''}`;
        const countHtml = hasWords ? `<span class="day-count">${dayData.count}</span>` : '';
        grid.innerHTML += `<div class="${cls}" onclick="selectCalendarDate('${dateStr}')"><span>${d}</span>${countHtml}</div>`;
      }
    }

    function changeCalendarMonth(delta) {
      calendarCurrentDate.setMonth(calendarCurrentDate.getMonth() + delta);
      renderCalendar();
    }

    function selectCalendarDate(dateStr) {
      selectedCalendarDate = dateStr;
      renderCalendar();
      const byDate = getWordCountByDate();
      const dayData = byDate[dateStr];
      const detail = document.getElementById('selectedDayDetail');
      const title = document.getElementById('selectedDayTitle');
      const pagesDiv = document.getElementById('selectedDayPages');

      if (dayData) {
        detail.classList.remove('hidden');
        title.textContent = `${dateStr} 背了 ${dayData.count} 个单词，涉及 ${dayData.pages.length} 页`;
        pagesDiv.innerHTML = dayData.pages.map(p => `<span class="selected-page-tag">第 ${p} 页</span>`).join('');
      } else {
        detail.classList.remove('hidden');
        title.textContent = `${dateStr} 没有背单词`;
        pagesDiv.innerHTML = '';
      }
    }

    function renderWordBook() {
      const container = document.getElementById('wordBookList');
      if (!container) return;

      const allPages = new Set();
      Object.values(state.reviewPools).forEach(pool => pool.forEach(p => allPages.add(p)));
      Object.keys(state.wordMap).forEach(p => allPages.add(parseInt(p)));

      const sortedPages = Array.from(allPages).sort((a, b) => a - b);

      if (sortedPages.length === 0) {
        container.innerHTML = '<div class="empty-tip">还没有背过任何页面，先抽取或记录今天背诵吧</div>';
        return;
      }

      container.innerHTML = sortedPages.map(p => {
        const firstDate = getFirstDrawn(p);
        const dateText = firstDate ? `首次抽到：${firstDate}` : '';
        const wordCount = getWords(p).length;
        return `
        <div class="page-card">
          <div class="page-header" onclick="togglePageWords(${p})">
            <div>
              <span class="page-title">第 ${p} 页</span>
              ${dateText ? `<div class="page-meta">${dateText}</div>` : ''}
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="word-count">${wordCount} 个单词</span>
              <span class="click-hint">点击展开</span>
            </div>
          </div>
          <div class="word-section hidden" id="word-section-${p}">
            <div class="word-list" id="word-list-${p}">
              ${renderWords(p)}
            </div>
            <div class="dict-input-row" onclick="event.stopPropagation()">
              <input type="text" class="dict-input" id="word-input-${p}" placeholder="单词，例如：abandon">
              <input type="text" class="dict-input" id="phonetic-input-${p}" placeholder="音标（可自动获取）">
              <input type="text" class="dict-input" id="meaning-input-${p}" placeholder="中文释义（可自动获取）">
            </div>
            <div class="word-input-row" onclick="event.stopPropagation()">
              <span class="loading hidden" id="loading-${p}">正在查词...</span>
              <button class="btn-add-word" onclick="addWordsFromInput(${p})">添加单词</button>
            </div>
          </div>
        </div>
      `}).join('');
    }

    function renderAll() {
      renderStatus();
      renderWordBook();
      renderSchedule();
      renderStats();
      renderCalendar();
      if (lastDrawnNew) renderPageList('newResultList', lastDrawnNew);
      if (lastReviewDraw) renderPageList('reviewResultList', lastReviewDraw.drawn);
      if (lastTodayPages) renderPageList('todayResultList', lastTodayPages, true);
    }

    // ============== 操作 ==============

    function recordTodayPages() {
      const input = document.getElementById('todayPages');
      const text = input.value.trim();
      if (!text) {
        alert('请输入页码');
        return;
      }

      const pages = text.split(/[,，\s]+/)
        .map(s => parseInt(s.trim()))
        .filter(n => !isNaN(n) && n >= 1 && n <= state.total);

      if (pages.length === 0) {
        alert('没有有效的页码');
        return;
      }

      const uniquePages = [...new Set(pages)].sort((a, b) => a - b);

      // 从单词池移除，加入复习单词池 1
      state.newPool = removePages(state.newPool, uniquePages);
      addToPool('1', uniquePages);
      recordFirstDrawn(uniquePages);
      logAction('今天指定背诵', uniquePages);
      saveState();

      input.value = '';
      lastTodayPages = uniquePages;

      document.getElementById('todayResult').classList.remove('hidden');
      renderPageList('todayResultList', uniquePages, true);

      alert(`已记录今天背诵：第 ${uniquePages.join('、')} 页，已加入复习单词池 1`);
      renderAll();
    }

    function drawNew() {
      const input = document.getElementById('newDrawCount');
      const count = parseInt(input.value);
      if (isNaN(count) || count <= 0) {
        alert('请输入有效的抽取数量');
        return;
      }
      if (state.newPool.length === 0) {
        alert('单词池已空');
        return;
      }

      const drawn = drawFromPool(state.newPool, count);
      state.newPool = removePages(state.newPool, drawn);
      addToPool('1', drawn);
      recordFirstDrawn(drawn);
      logAction('从单词池抽取', drawn);
      saveState();

      lastDrawnNew = drawn;

      document.getElementById('newResult').classList.remove('hidden');
      renderPageList('newResultList', drawn);
      renderAll();
    }

    function drawReview() {
      const select = document.getElementById('reviewPoolSelect');
      const poolName = select.value;
      if (!poolName) {
        alert('当前没有可复习的页码');
        return;
      }

      const input = document.getElementById('reviewDrawCount');
      const count = parseInt(input.value);
      if (isNaN(count) || count <= 0) {
        alert('请输入有效的抽取数量');
        return;
      }

      const pool = state.reviewPools[poolName];
      if (!pool || pool.length === 0) {
        alert('该复习单词池已空');
        return;
      }

      const drawn = drawFromPool(pool, count);
      lastReviewDraw = { poolName, drawn };

      document.getElementById('reviewResult').classList.remove('hidden');
      document.getElementById('reviewResultTitle').textContent = `从复习单词池 ${poolName} 抽取`;
      renderPageList('reviewResultList', drawn, false);
      document.getElementById('moveNextBtn').style.display = 'block';
    }

    function moveToNextPool() {
      if (!lastReviewDraw) return;
      const { poolName, drawn } = lastReviewDraw;
      state.reviewPools[poolName] = removePages(state.reviewPools[poolName], drawn);
      const nextName = String(parseInt(poolName) + 1);
      addToPool(nextName, drawn);
      logAction(`复习单词池 ${poolName} 完成，移入复习单词池 ${nextName}`, drawn);
      saveState();

      alert(`已移入复习单词池 ${nextName}`);
      document.getElementById('reviewResult').classList.add('hidden');
      lastReviewDraw = null;
      renderAll();
    }

    function initFromInput() {
      const total = parseInt(document.getElementById('totalPages').value);
      if (isNaN(total) || total < 1) {
        alert('请输入有效的总页数');
        return;
      }
      if (confirm(`确定要重置吗？当前进度会清空，总页数设为 ${total}。`)) {
        state = initState(total);
        saveState();
        lastDrawnNew = null;
        lastReviewDraw = null;
        lastTodayPages = null;
        document.getElementById('newResult').classList.add('hidden');
        document.getElementById('reviewResult').classList.add('hidden');
        document.getElementById('todayResult').classList.add('hidden');
        renderAll();
      }
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '背单词状态备份.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data.newPool && data.reviewPools) {
            state = migrateState(data);
            saveState();
            lastDrawnNew = null;
            lastReviewDraw = null;
            lastTodayPages = null;
            document.getElementById('newResult').classList.add('hidden');
            document.getElementById('reviewResult').classList.add('hidden');
            document.getElementById('todayResult').classList.add('hidden');
            renderAll();
            alert('备份导入成功');
          } else {
            alert('备份文件格式不正确');
          }
        } catch (err) {
          alert('读取备份失败');
        }
      };
      reader.readAsText(file);
      input.value = '';
    }

    // 初始化
    state = loadState();
    if (!state.wordMap) state.wordMap = {};
    if (!state.firstDrawnMap) state.firstDrawnMap = {};

    // 设置默认查询日期为本月
    const todayForQuery = new Date();
    const firstDayOfMonth = new Date(todayForQuery.getFullYear(), todayForQuery.getMonth(), 1);
    const lastDayOfMonth = new Date(todayForQuery.getFullYear(), todayForQuery.getMonth() + 1, 0);
    document.getElementById('queryStartDate').value = formatDate(firstDayOfMonth);
    document.getElementById('queryEndDate').value = formatDate(lastDayOfMonth);

    renderAll();
  </script>
</body>
</html>
