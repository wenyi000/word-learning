<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>背单词抽页码</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f7;
      color: #333;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 22px;
      text-align: center;
      margin: 16px 0 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #1c1c1e;
    }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .status-item {
      background: #f2f2f7;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .status-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    .status-value {
      font-size: 20px;
      font-weight: 700;
      color: #007aff;
    }
    label {
      display: block;
      font-size: 14px;
      color: #666;
      margin: 10px 0 6px;
    }
    input[type="number"], select, input[type="text"].word-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    .btn-primary { background: #007aff; color: #fff; }
    .btn-success { background: #34c759; color: #fff; }
    .btn-warning { background: #ff9500; color: #fff; }
    .btn-danger { background: #ff3b30; color: #fff; }
    .btn-secondary { background: #8e8e93; color: #fff; }
    .btn-add-word {
      width: auto;
      padding: 8px 16px;
      margin: 0;
      background: #007aff;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
    }
    .result-box {
      background: #e8f4fd;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.6;
    }
    .result-title {
      font-weight: 600;
      color: #007aff;
      margin-bottom: 6px;
    }
    .page-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .page-card {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #d1e6f7;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .page-title {
      font-weight: 600;
      color: #007aff;
    }
    .page-meta {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }
    .word-count {
      font-size: 13px;
      color: #666;
    }
    .word-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #cce0f0;
    }
    .word-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .word-tag {
      background: #f2f2f7;
      color: #333;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .word-tag .delete-word {
      color: #ff3b30;
      cursor: pointer;
      font-weight: bold;
    }
    .word-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .word-input-row .word-input {
      flex: 1;
      margin: 0;
    }
    .empty-tip {
      font-size: 13px;
      color: #999;
      font-style: italic;
    }
    .history-item {
      font-size: 13px;
      color: #666;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }
    .hidden { display: none; }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin: 24px 0;
    }
    .tip {
      font-size: 13px;
      color: #666;
      margin-top: 8px;
    }
    .schedule-date {
      font-weight: 600;
      color: #333;
      margin-top: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    .schedule-action {
      font-size: 13px;
      color: #555;
      margin: 6px 0 4px;
    }
    .schedule-pages {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
    }
    .schedule-page {
      background: #e8f4fd;
      color: #007aff;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>📚 背单词抽页码</h1>

  <div class="card">
    <div class="card-title">设置</div>
    <label>单词本总页数</label>
    <input type="number" id="totalPages" value="634" min="1">
    <label>已背过的页码（用逗号分隔，可选）</label>
    <input type="text" id="knownPages" placeholder="例如：56,231,256">
    <button class="btn-secondary" onclick="initFromInput()">初始化 / 重置</button>
  </div>

  <div class="card">
    <div class="card-title">📊 当前状态</div>
    <div class="status-grid" id="statusGrid">
      <div class="status-item">
        <div class="status-label">新背池</div>
        <div class="status-value" id="newCount">0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🎲 抽取新背页码</div>
    <label>今天要抽几页？</label>
    <input type="number" id="newDrawCount" value="5" min="1">
    <button class="btn-primary" onclick="drawNew()">抽取新背</button>
    <div id="newResult" class="result-box hidden">
      <div class="result-title">今天新背</div>
      <div class="tip">点击每一页可以添加/查看单词</div>
      <div class="page-list" id="newResultList"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🔁 抽取复习页码</div>
    <label>选择复习池</label>
    <select id="reviewPoolSelect"></select>
    <label>今天要复习几页？</label>
    <input type="number" id="reviewDrawCount" value="3" min="1">
    <button class="btn-success" onclick="drawReview()">抽取复习</button>
    <div id="reviewResult" class="result-box hidden">
      <div class="result-title" id="reviewResultTitle">复习内容</div>
      <div class="tip">点击每一页可以查看/编辑单词</div>
      <div class="page-list" id="reviewResultList"></div>
      <button class="btn-warning" id="moveNextBtn" onclick="moveToNextPool()" style="margin-top:12px;">复习完成，移入下一轮</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📅 背诵日程</div>
    <div id="scheduleList"></div>
  </div>

  <div class="card">
    <div class="card-title">💾 数据备份</div>
    <button class="btn-primary" onclick="exportData()">导出备份</button>
    <label style="margin-top:10px;">导入备份文件</label>
    <input type="file" id="importFile" accept=".json" onchange="importData(this)">
  </div>

  <div class="card">
    <div class="card-title">📝 最近操作</div>
    <div id="historyList" style="max-height:200px;overflow:auto;"></div>
  </div>

  <div class="footer">数据自动保存在本机浏览器中</div>

  <script>
    const STORAGE_KEY = 'wordLearningState_v3';
    let state = null;
    let lastReviewDraw = null;
    let lastDrawnNew = null;

    function initState(total = 634) {
      return {
        total: total,
        newPool: Array.from({length: total}, (_, i) => i + 1),
        reviewPools: {},
        wordMap: {},
        firstDrawnMap: {},
        history: []
      };
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {
          console.error('读取保存数据失败', e);
        }
      }
      return initState();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getNowStr() {
      return new Date().toLocaleString('zh-CN');
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function drawFromPool(pool, count) {
      if (count <= 0 || pool.length === 0) return [];
      const shuffled = shuffleArray(pool);
      return shuffled.slice(0, Math.min(count, pool.length)).sort((a, b) => a - b);
    }

    function removePages(pool, pages) {
      return pool.filter(p => !pages.includes(p));
    }

    function addToPool(poolName, pages) {
      if (!state.reviewPools[poolName]) {
        state.reviewPools[poolName] = [];
      }
      state.reviewPools[poolName] = [...new Set([...state.reviewPools[poolName], ...pages])].sort((a, b) => a - b);
    }

    function logAction(action, pages) {
      const time = getNowStr();
      state.history.unshift({ time, action, pages });
      if (state.history.length > 200) state.history.pop();
    }

    function recordFirstDrawn(pages) {
      const today = getTodayStr();
      pages.forEach(page => {
        if (!state.firstDrawnMap[page]) {
          state.firstDrawnMap[page] = today;
        }
      });
    }

    function getFirstDrawn(page) {
      return state.firstDrawnMap[page] || null;
    }

    // ============== 单词管理 ==============

    function getWords(page) {
      return state.wordMap[page] || [];
    }

    function addWords(page, words) {
      const newWords = words.map(w => w.trim()).filter(w => w);
      if (newWords.length === 0) return;
      const current = getWords(page);
      state.wordMap[page] = [...new Set([...current, ...newWords])].sort();
      saveState();
      renderPageList('newResultList', lastDrawnNew || []);
      if (lastReviewDraw) {
        renderPageList('reviewResultList', lastReviewDraw.drawn);
      }
    }

    function removeWord(page, word) {
      if (state.wordMap[page]) {
        state.wordMap[page] = state.wordMap[page].filter(w => w !== word);
        if (state.wordMap[page].length === 0) {
          delete state.wordMap[page];
        }
        saveState();
        renderPageList('newResultList', lastDrawnNew || []);
        if (lastReviewDraw) {
          renderPageList('reviewResultList', lastReviewDraw.drawn);
        }
      }
    }

    function togglePageWords(page) {
      const section = document.getElementById(`word-section-${page}`);
      if (section) {
        section.classList.toggle('hidden');
      }
    }

    function addWordsFromInput(page) {
      const input = document.getElementById(`word-input-${page}`);
      if (!input) return;
      const text = input.value;
      if (!text.trim()) return;
      const words = text.split(/[,，\n]/);
      addWords(page, words);
      input.value = '';
    }

    function renderWords(page) {
      const words = getWords(page);
      if (words.length === 0) {
        return '<div class="empty-tip">暂无单词，点击添加</div>';
      }
      return words.map(w => `
        <span class="word-tag">
          ${w}
          <span class="delete-word" onclick="event.stopPropagation(); removeWord(${page}, '${w.replace(/'/g, "\\'")}')">×</span>
        </span>
      `).join('');
    }

    function renderPageList(containerId, pages) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = pages.map(p => {
        const firstDate = getFirstDrawn(p);
        const dateText = firstDate ? `首次抽到：${firstDate}` : '首次抽到：今天';
        return `
        <div class="page-card">
          <div class="page-header" onclick="togglePageWords(${p})">
            <div>
              <span class="page-title">第 ${p} 页</span>
              <div class="page-meta">${dateText}</div>
            </div>
            <span class="word-count">${getWords(p).length} 个单词</span>
          </div>
          <div class="word-section hidden" id="word-section-${p}">
            <div class="word-list" id="word-list-${p}">
              ${renderWords(p)}
            </div>
            <div class="word-input-row" onclick="event.stopPropagation()">
              <input type="text" class="word-input" id="word-input-${p}" placeholder="输入单词，多个用逗号分隔">
              <button class="btn-add-word" onclick="addWordsFromInput(${p})">添加</button>
            </div>
          </div>
        </div>
      `}).join('');
    }

    // ============== 页面渲染 ==============

    function renderStatus() {
      document.getElementById('totalPages').value = state.total;
      document.getElementById('newCount').textContent = state.newPool.length;

      const grid = document.getElementById('statusGrid');
      grid.innerHTML = `
        <div class="status-item">
          <div class="status-label">新背池</div>
          <div class="status-value">${state.newPool.length}</div>
        </div>
      `;

      const poolNames = Object.keys(state.reviewPools).sort((a, b) => parseInt(a) - parseInt(b));
      poolNames.forEach(name => {
        if (state.reviewPools[name].length > 0) {
          grid.innerHTML += `
            <div class="status-item">
              <div class="status-label">复习池 ${name}</div>
              <div class="status-value">${state.reviewPools[name].length}</div>
            </div>
          `;
        }
      });

      const select = document.getElementById('reviewPoolSelect');
      select.innerHTML = '';
      const nonEmptyPools = poolNames.filter(name => state.reviewPools[name].length > 0);
      if (nonEmptyPools.length === 0) {
        select.innerHTML = '<option value="">没有可复习的页码</option>';
      } else {
        nonEmptyPools.forEach(name => {
          select.innerHTML += `<option value="${name}">复习池 ${name}（${state.reviewPools[name].length} 页）</option>`;
        });
      }
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (state.history.length === 0) {
        list.innerHTML = '<div class="history-item">暂无操作记录</div>';
        return;
      }
      list.innerHTML = state.history.slice(0, 20).map(h => `
        <div class="history-item">
          <strong>${h.time}</strong><br>
          ${h.action}：${h.pages.join('、')}
        </div>
      `).join('');
    }

    function renderSchedule() {
      const container = document.getElementById('scheduleList');
      if (state.history.length === 0) {
        container.innerHTML = '<div class="empty-tip">暂无日程记录</div>';
        return;
      }

      // 按日期分组
      const groups = {};
      state.history.forEach(h => {
        const date = h.time.split(' ')[0];
        if (!groups[date]) {
          groups[date] = [];
        }
        groups[date].push(h);
      });

      const dates = Object.keys(groups).sort((a, b) => new Date(b) - new Date(a));

      container.innerHTML = dates.map(date => {
        const items = groups[date];
        return `
          <div class="schedule-date">${date}</div>
          ${items.map(h => `
            <div class="schedule-action">${h.action}</div>
            <div class="schedule-pages">
              ${h.pages.map(p => `<span class="schedule-page">第 ${p} 页</span>`).join('')}
            </div>
          `).join('')}
        `;
      }).join('');
    }

    function renderAll() {
      renderStatus();
      renderHistory();
      renderSchedule();
      if (lastDrawnNew) renderPageList('newResultList', lastDrawnNew);
      if (lastReviewDraw) renderPageList('reviewResultList', lastReviewDraw.drawn);
    }

    // ============== 操作 ==============

    function drawNew() {
      const input = document.getElementById('newDrawCount');
      const count = parseInt(input.value);
      if (isNaN(count) || count <= 0) {
        alert('请输入有效的抽取数量');
        return;
      }
      if (state.newPool.length === 0) {
        alert('新背池已空');
        return;
      }

      const drawn = drawFromPool(state.newPool, count);
      state.newPool = removePages(state.newPool, drawn);
      addToPool('1', drawn);
      recordFirstDrawn(drawn);
      logAction('新背', drawn);
      saveState();

      lastDrawnNew = drawn;

      document.getElementById('newResult').classList.remove('hidden');
      renderPageList('newResultList', drawn);
      renderAll();
    }

    function drawReview() {
      const select = document.getElementById('reviewPoolSelect');
      const poolName = select.value;
      if (!poolName) {
        alert('当前没有可复习的页码');
        return;
      }

      const input = document.getElementById('reviewDrawCount');
      const count = parseInt(input.value);
      if (isNaN(count) || count <= 0) {
        alert('请输入有效的抽取数量');
        return;
      }

      const pool = state.reviewPools[poolName];
      if (!pool || pool.length === 0) {
        alert('该复习池已空');
        return;
      }

      const drawn = drawFromPool(pool, count);
      lastReviewDraw = { poolName, drawn };

      document.getElementById('reviewResult').classList.remove('hidden');
      document.getElementById('reviewResultTitle').textContent = `从复习池 ${poolName} 抽取`;
      renderPageList('reviewResultList', drawn);
      document.getElementById('moveNextBtn').style.display = 'block';
    }

    function moveToNextPool() {
      if (!lastReviewDraw) return;
      const { poolName, drawn } = lastReviewDraw;
      state.reviewPools[poolName] = removePages(state.reviewPools[poolName], drawn);
      const nextName = String(parseInt(poolName) + 1);
      addToPool(nextName, drawn);
      logAction(`复习池 ${poolName} 完成，移入复习池 ${nextName}`, drawn);
      saveState();

      alert(`已移入复习池 ${nextName}`);
      document.getElementById('reviewResult').classList.add('hidden');
      lastReviewDraw = null;
      renderAll();
    }

    function initFromInput() {
      const total = parseInt(document.getElementById('totalPages').value);
      if (isNaN(total) || total < 1) {
        alert('请输入有效的总页数');
        return;
      }

      // 读取已背过的页码
      const knownInput = document.getElementById('knownPages').value;
      let knownPages = [];
      if (knownInput.trim()) {
        knownPages = knownInput.split(/[,，\s]+/)
          .map(s => parseInt(s.trim()))
          .filter(n => !isNaN(n) && n >= 1 && n <= total);
        knownPages = [...new Set(knownPages)].sort((a, b) => a - b);
      }

      const knownText = knownPages.length > 0 ? `，其中第 ${knownPages.join('、')} 页标记为已背过` : '';

      if (confirm(`确定要重置吗？当前进度会清空，总页数设为 ${total}${knownText}。`)) {
        state = initState(total);

        if (knownPages.length > 0) {
          state.newPool = removePages(state.newPool, knownPages);
          addToPool('1', knownPages);
          recordFirstDrawn(knownPages);
          logAction('初始化：标记已背过页码', knownPages);
        }

        saveState();
        lastDrawnNew = null;
        lastReviewDraw = null;
        document.getElementById('newResult').classList.add('hidden');
        document.getElementById('reviewResult').classList.add('hidden');
        renderAll();
      }
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '背单词状态备份.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data.newPool && data.reviewPools) {
            if (!data.wordMap) data.wordMap = {};
            if (!data.firstDrawnMap) data.firstDrawnMap = {};
            state = data;
            saveState();
            lastDrawnNew = null;
            lastReviewDraw = null;
            document.getElementById('newResult').classList.add('hidden');
            document.getElementById('reviewResult').classList.add('hidden');
            renderAll();
            alert('备份导入成功');
          } else {
            alert('备份文件格式不正确');
          }
        } catch (err) {
          alert('读取备份失败');
        }
      };
      reader.readAsText(file);
      input.value = '';
    }

    // 初始化
    state = loadState();
    if (!state.wordMap) state.wordMap = {};
    if (!state.firstDrawnMap) state.firstDrawnMap = {};
    renderAll();
  </script>
</body>
</html>
